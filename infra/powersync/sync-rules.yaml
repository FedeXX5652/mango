# Reglas de sincronizacion: que filas ve cada cliente.
#
# Fase 1 (un solo usuario): un bucket GLOBAL que sincroniza todo. Es correcto
# porque hay un unico usuario. En fase 3 (multiusuario) esto pasa a buckets
# parametrizados por `request.user_id()` filtrando por owner_id/visibility,
# para que cada persona solo reciba lo suyo y lo compartido de su grupo.
#
# PowerSync usa la columna `id` (UUID) como identificador de cada fila.
#
# OJO: el servicio lee este archivo AL ARRANCAR. Si se agrega o se saca una
# tabla hay que reiniciarlo (`docker compose restart powersync`), o el cliente
# escribe local, sube bien y despues pierde su copia local cuando confirma el
# checkpoint: para el servidor esa tabla no esta en ningun bucket.

bucket_definitions:
  global:
    data:
      # Solo las tablas que el cliente materializa en su esquema local
      # (frontend/src/lib/powersync/esquema.ts). Al construir el front de
      # splits/reglas de ingesta, re-agregar aca: category_rules,
      # transaction_splits. Los datos siguen en Postgres.
      - SELECT * FROM accounts
      - SELECT * FROM categories
      - SELECT * FROM payment_methods
      - SELECT * FROM payment_method_accounts
      - SELECT * FROM transactions
      - SELECT * FROM budgets
      - SELECT * FROM budget_rules
      - SELECT * FROM recurring_rules
      - SELECT * FROM templates
      - SELECT * FROM tags
      - SELECT * FROM transaction_tags
      # Cotizaciones: la copia local ES la cache que usa el patrimonio sin
      # conexion (ver 0005). Sirve para estimar, nunca para registrar.
      - SELECT * FROM exchange_rates
