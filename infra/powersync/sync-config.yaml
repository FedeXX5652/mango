# Reglas de sincronizacion: que filas ve cada cliente.
#
# Formato **Sync Streams** (edition 3). Reemplaza al de `bucket_definitions`,
# que PowerSync sigue soportando pero marca como legacy.
#
# PowerSync usa la columna `id` (UUID) como identificador de cada fila.
#
# OJO, dos trampas:
#
# 1. El servicio lee este archivo AL ARRANCAR. Si se agrega o se saca una tabla
#    hay que reiniciarlo (`docker compose restart powersync`), o el cliente
#    escribe local, sube bien y despues pierde su copia local cuando confirma el
#    checkpoint: para el servidor esa tabla no esta en ningun stream.
#
# 2. Un stream **no se auto-suscribe por defecto**. Sin `auto_subscribe: true`
#    la tabla deja de llegar y la app la muestra vacia, sin ningun error. Es el
#    modo de fallar mas silencioso que tiene esto: despues de tocar el archivo,
#    contar filas tabla por tabla, no mirar la pantalla.

config:
  edition: 3

streams:
  # Todo lo del usuario del token, y nada mas. Va en UN stream con varias
  # consultas y no en varios streams: cada combinacion de stream y parametro es
  # un bucket, y conviene tener pocos.
  #
  # Esto **no es autenticacion**: hoy la API firma el token del usuario semilla.
  # Lo que resuelve es la particion, que es la mitad de lo que fase 3 necesita;
  # la otra mitad es un stream de grupo, parametrizado por la tabla de miembros,
  # que va a convivir con este sin reemplazarlo.
  mio:
    auto_subscribe: true
    queries:
      # Las tablas que el cliente materializa en su esquema local
      # (frontend/src/lib/powersync/esquema.ts). Al construir el front de
      # splits/reglas de ingesta, re-agregar aca: category_rules,
      # transaction_splits. Los datos siguen en Postgres.
      - SELECT * FROM accounts WHERE owner_id = auth.user_id()
      - SELECT * FROM categories WHERE owner_id = auth.user_id()
      - SELECT * FROM payment_methods WHERE owner_id = auth.user_id()
      - SELECT * FROM payment_method_accounts WHERE owner_id = auth.user_id()
      - SELECT * FROM transactions WHERE owner_id = auth.user_id()
      - SELECT * FROM budgets WHERE owner_id = auth.user_id()
      - SELECT * FROM budget_rules WHERE owner_id = auth.user_id()
      - SELECT * FROM recurring_rules WHERE owner_id = auth.user_id()
      - SELECT * FROM templates WHERE owner_id = auth.user_id()
      - SELECT * FROM tags WHERE owner_id = auth.user_id()
      - SELECT * FROM transaction_tags WHERE owner_id = auth.user_id()

      # Los pagos que HICE, enteros (con cuenta y medio): los necesito completos
      # para descontarlos de mi saldo (0017). A los otros miembros les llega la
      # version sin cuenta/medio por el stream `grupo`.
      - SELECT * FROM settlements WHERE from_user_id = auth.user_id()

      # Mis avisos in-app (0019). Los crea el servidor; aca solo los marco leidos.
      - SELECT * FROM notifications WHERE user_id = auth.user_id()

      # Las preferencias, para que se puedan leer y escribir sin conexion y
      # viajen entre dispositivos.
      #
      # **Las columnas van una por una a proposito.** `password_hash` no esta en
      # la lista, y por eso no puede salir del servidor: no es una lista negra
      # que alguien tenga que acordarse de actualizar, es que no se selecciona.
      # Si algun dia se agrega una columna sensible a `users`, no llega sola.
      - SELECT id, display_name, base_currency, theme_id, color_scheme, fx_manual
        FROM users WHERE id = auth.user_id()

  # Las cotizaciones son **compartidas y a proposito**: el dolar del 12/09 es el
  # mismo para todos, y que uno cargue el MEP y lo vean los demas es la gracia.
  # No tienen dueño en el esquema y no se lo vamos a inventar (0005 dejaba la
  # pregunta abierta; esta es la respuesta).
  cotizaciones:
    auto_subscribe: true
    # Sin filtro por usuario, deliberado: ver arriba. Sin esto el servicio avisa
    # que la consulta expone las filas a cualquier cliente, y tiene razon, pero
    # es justamente lo que se quiere.
    accept_potentially_dangerous_queries: true
    query: SELECT * FROM exchange_rates

  # Grupos a los que pertenece el usuario, sus miembros, y los movimientos
  # COMPARTIDOS del grupo (fase 3b, ver 0009). Convive con `mio`, no lo
  # reemplaza: lo personal sigue por owner.
  grupo:
    auto_subscribe: true
    with:
      # Los grupos del usuario, una vez, para no repetir la subconsulta.
      mis_grupos: |
        SELECT group_id FROM group_members
        WHERE user_id = auth.user_id() AND deleted_at IS NULL
      # Los movimientos compartidos de esos grupos. Se reusa para traer los
      # vinculos transaction_tags de cada gasto compartido.
      #
      # OJO: un CTE no puede referenciar a otro CTE (limitacion de Sync Streams),
      # asi que la membresia va INLINE aca, no via `mis_grupos`.
      tx_compartidas: |
        SELECT id FROM transactions
        WHERE group_id IN (
          SELECT group_id FROM group_members
          WHERE user_id = auth.user_id() AND deleted_at IS NULL
        )
          AND visibility = 'shared' AND deleted_at IS NULL
    queries:
      - SELECT * FROM groups WHERE id IN (SELECT group_id FROM mis_grupos)
      - SELECT * FROM group_members WHERE group_id IN (SELECT group_id FROM mis_grupos)

      # Cuentas CONJUNTAS del grupo (fase 3b, ver 0016): las ven todos los
      # miembros (owner_id NULL, group_id del grupo). A diferencia de las cuentas
      # personales, la de grupo es de todos: viaja entera.
      - SELECT * FROM accounts WHERE group_id IN (SELECT group_id FROM mis_grupos)

      # Perfil PUBLICO de los otros miembros, para mostrar "cargado por X". Solo
      # columnas publicas: nunca password_hash ni email (ver 0009/0013). Las
      # preferencias (base_currency, tema…) tampoco: no son asunto del grupo.
      - SELECT id, username, display_name FROM users
        WHERE id IN (SELECT user_id FROM group_members WHERE group_id IN (SELECT group_id FROM mis_grupos))

      # Los movimientos compartidos, SIN lo privado: no viajan account_id,
      # payment_method_id, amount_account, exchange_rate ni notes. El resto —
      # monto, moneda, fecha, comercio, categoria, quien — si. Un movimiento
      # privado nunca entra (visibility = 'shared').
      - SELECT id, owner_id, group_id, visibility, kind, status, occurred_at,
               category_id, amount, currency, payee, source, paid_from_group,
               created_at, updated_at, deleted_at
        FROM transactions
        WHERE group_id IN (SELECT group_id FROM mis_grupos)
          AND visibility = 'shared'

      # La taxonomia DEL GRUPO viaja entera: categorias y tags con group_id de un
      # grupo del usuario. Son del grupo, todos los miembros las ven y las editan,
      # y un gasto compartido se categoriza con ellas (ver 0014). Ya no viaja "solo
      # la referenciada": eso era 3b.2, corregido por 0014.
      - SELECT * FROM categories WHERE group_id IN (SELECT group_id FROM mis_grupos)
      - SELECT * FROM tags WHERE group_id IN (SELECT group_id FROM mis_grupos)

      # Presupuestos del grupo (fase 3b.3, ver 0015): por group_id, los ven todos.
      - SELECT * FROM budgets WHERE group_id IN (SELECT group_id FROM mis_grupos)

      # Los vinculos tag<->movimiento de cada gasto compartido: para saber que
      # tags tiene un movimiento del grupo. El tag ya viajo por group_id arriba.
      - SELECT * FROM transaction_tags
        WHERE transaction_id IN (SELECT id FROM tx_compartidas) AND deleted_at IS NULL

      # Las partes (splits) de cada gasto compartido: el reparto tipo Splitwise
      # (fase 3b.3, ver 0015). Todos los miembros las ven para calcular el balance.
      - SELECT * FROM transaction_splits
        WHERE transaction_id IN (SELECT id FROM tx_compartidas) AND deleted_at IS NULL

      # Los pagos entre miembros para saldar deudas del grupo (0015/0017). Van por
      # group_id: son del grupo, todos los ven. SIN cuenta ni medio de pago: eso
      # es privado del que pago (le llega entero por su stream `mio`).
      - SELECT id, group_id, from_user_id, to_user_id, amount, currency, occurred_at,
               note, created_by, created_at, updated_at, deleted_at
        FROM settlements WHERE group_id IN (SELECT group_id FROM mis_grupos)
