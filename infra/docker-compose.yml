services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    container_name: mango-postgres
    # PowerSync replica por WAL logico; sin esto no puede leer los cambios.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar}
      POSTGRES_DB: ${POSTGRES_DB:-mango}
    ports:
      - "5432:5432"
    volumes:
      - mango-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mango} -d ${POSTGRES_DB:-mango}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Postgres separado donde PowerSync guarda sus buckets de sincronizacion.
  powersync-storage:
    restart: unless-stopped
    image: postgres:16
    container_name: mango-powersync-storage
    environment:
      POSTGRES_USER: ${POWERSYNC_STORAGE_USER:-powersync}
      POSTGRES_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:-powersync}
      POSTGRES_DB: ${POWERSYNC_STORAGE_DB:-powersync}
    volumes:
      - mango-powersync-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POWERSYNC_STORAGE_USER:-powersync} -d ${POWERSYNC_STORAGE_DB:-powersync}"]
      interval: 5s
      timeout: 5s
      retries: 5

  powersync:
    restart: unless-stopped
    image: journeyapps/powersync-service:latest
    container_name: mango-powersync
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
      powersync-storage:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      # Fuente de datos (la base de la app) y storage de buckets, por DNS de docker.
      PS_DATA_SOURCE_URI: postgresql://${POSTGRES_USER:-mango}:${POSTGRES_PASSWORD:-cambiar}@postgres:5432/${POSTGRES_DB:-mango}
      PS_STORAGE_SOURCE_URI: postgresql://${POWERSYNC_STORAGE_USER:-powersync}:${POWERSYNC_STORAGE_PASSWORD:-powersync}@powersync-storage:5432/${POWERSYNC_STORAGE_DB:-powersync}
      PS_PORT: "8080"
      # Clave HS256 compartida (base64url) que valida los JWT de los clientes.
      PS_JWKS_K: ${POWERSYNC_JWT_SECRET}
      PS_JWT_AUDIENCE: ${POWERSYNC_JWT_AUDIENCE:-powersync}
    ports:
      - "8080:8080"
    volumes:
      - ./powersync:/config
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 2s
      retries: 15

  # API de la app. Migra y siembra al arrancar (docker-entrypoint.sh).
  backend:
    restart: unless-stopped
    build:
      context: ../backend
    container_name: mango-backend
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro de docker la base es `postgres`, no localhost, y async.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mango}:${POSTGRES_PASSWORD:-cambiar}@postgres:5432/${POSTGRES_DB:-mango}
      # Firma las sesiones (0013). Sin una propia el contenedor no arranca (lo
      # corta el entrypoint); aca no se exige para que `make dev` no la pida.
      SECRET_KEY: ${SECRET_KEY:-}
      # Mismo secreto que firma PowerSync: la API emite los JWT, PowerSync los valida.
      POWERSYNC_JWT_SECRET: ${POWERSYNC_JWT_SECRET}
      POWERSYNC_JWT_AUDIENCE: ${POWERSYNC_JWT_AUDIENCE:-powersync}
      # El navegador llega a PowerSync por el mismo origen: el nginx del
      # frontend hace de proxy (ver 0020).
      POWERSYNC_URL: /powersync
      # Orígenes permitidos para CORS (desarrollo con la PWA en otro puerto). JSON.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8081","http://localhost:5173"]}
    ports:
      - "8000:8000"
    volumes:
      # Fotos de tickets: en un volumen, para que sobrevivan a un rebuild.
      - mango-attachments:/data/attachments
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 10

  # PWA + puerta de entrada: nginx sirve la app y hace de proxy a /api y a
  # /powersync (mismo origen, ver 0020). Sin URLs horneadas.
  frontend:
    restart: unless-stopped
    profiles: ["app"]
    build:
      context: ../frontend
    container_name: mango-frontend
    depends_on:
      - backend
      - powersync
    ports:
      - "8081:80"

  # Respaldo de la base de la app. SOLO `mango`: la de powersync-storage es cache
  # derivada (se reconstruye sola desde `mango`) y no se respalda. pg_dump diario,
  # comprimido, con retención por dias (RETENTION_DAYS).
  backup:
    build:
      context: ./backup
    container_name: mango-backup
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-cambiar}
      POSTGRES_USER: ${POSTGRES_USER:-mango}
      POSTGRES_DB: ${POSTGRES_DB:-mango}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - mango-backups:/backups
    restart: unless-stopped

volumes:
  mango-pgdata:
  mango-powersync-storage:
  mango-attachments:
  mango-backups:
