# Servido de la PWA y puerta de entrada unica de Mango (ver 0020).
#
# La PWA le habla a su MISMO origen: nginx reparte `/api/` al backend y
# `/powersync/` a PowerSync. Asi la imagen del frontend no depende del host (no
# hay URL horneada), no hace falta CORS y se expone un solo puerto.
#
# Reglas que no pueden faltar:
#
# 1. Routing de SPA: cualquier ruta que no sea un archivo cae en index.html, o
#    entrar directo a /movimientos da 404 (react-router maneja la ruta en el
#    cliente).
# 2. El service worker NO se cachea: si el navegador se queda con un sw.js
#    viejo, la app nunca se actualiza. `autoUpdate` depende de poder bajarlo
#    fresco (ver 0012).
# 3. El stream de PowerSync es de larga duracion: sin buffering, con timeouts
#    largos y con upgrade a WebSocket (el SDK puede usar cualquiera de los dos).

# `Connection: upgrade` solo cuando el cliente pide WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS de docker, resuelto en cada request (con las URLs en variables). Sin
    # esto nginx resuelve `backend` al arrancar y NO arranca si el contenedor
    # todavia no existe, o queda apuntando a una IP vieja cuando se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API (FastAPI) ---------------------------------------------------------
    location /api/ {
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Adjuntos de hasta 10 MB (fase 5) + el sobre del multipart. El default
        # de nginx (1 MB) devolveria 413.
        client_max_body_size 12m;
    }

    # --- PowerSync -------------------------------------------------------------
    # El cliente usa `<origen>/powersync` como endpoint y le agrega la ruta
    # (`/sync/stream`, `/write-checkpoint2.json`...). Aca se saca el prefijo.
    location /powersync/ {
        set $powersync http://powersync:8080;
        rewrite ^/powersync/(.*)$ /$1 break;
        proxy_pass $powersync;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las lineas del stream tienen que llegar al instante, no en bloques.
        proxy_buffering off;
        proxy_cache off;
        # Conexion viva mientras la app este abierta.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- La PWA ----------------------------------------------------------------
    # El worker y el manifest siempre frescos: son los que gobiernan la
    # actualizacion del resto.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Los assets con hash en el nombre (build de Vite) se cachean fuerte: si
    # cambian, cambia el nombre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Todo lo demas: el archivo si existe, si no index.html (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
